name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test (Unit Tests)
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name:  Build project (skip tests for compile check)
        run: ./gradlew compileJava --no-daemon

      - name:  Run Unit Tests
        run: ./gradlew test --no-daemon

      - name:  Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()   # upload kể cả khi test fail
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Code Quality Check
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name:  Checkout source code
        uses: actions/checkout@v4

      - name:  Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name:  Grant execute permission for Gradle
        run: chmod +x gradlew

      - name:  Check code style (Checkstyle)
        run: ./gradlew checkstyleMain --no-daemon
        continue-on-error: true   # chưa chặn pipeline, chỉ cảnh báo

      - name:  Build JAR artifact
        run: ./gradlew jar --no-daemon

      - name:  Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auction-jar
          path: build/libs/*.jar
          retention-days: 14
